<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#302e2b" />
  <title>Chess with Friends</title>
  <link rel="icon" href="pieces/wN.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============ SCREEN 1: LOBBY ============ -->
  <section id="lobby">
    <div class="lobby-card">
      <img class="lobby-logo" src="pieces/wN.svg" alt="" />
      <h1>Chess with Friends</h1>
      <p id="lobby-text">Play chess online with a friend — free, no sign-up.</p>
      <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="nickname" />
      <button id="start-btn" class="btn btn-primary btn-big">Play a Friend</button>
      <button id="continue-btn" class="btn btn-secondary" hidden>Continue your last game</button>
    </div>
  </section>

  <!-- ============ SCREEN 2: GAME ============ -->
  <main id="game" hidden>
    <!-- Left: board with a player bar above and below -->
    <section class="board-col">
      <div class="player-bar" id="top-bar"></div>
      <div class="board-wrap">
        <div id="board"></div>
        <div id="promotion" hidden></div>
        <div id="gameover" hidden>
          <div class="gameover-card">
            <button class="gameover-close" id="gameover-close" aria-label="Close">✕</button>
            <div class="gameover-title" id="gameover-title"></div>
            <div class="gameover-reason" id="gameover-reason"></div>
            <button class="btn btn-primary btn-big" id="rematch-btn">Rematch</button>
          </div>
        </div>
      </div>
      <div class="player-bar" id="bottom-bar"></div>
    </section>

    <!-- Right: side panel -->
    <aside class="panel">
      <div class="panel-head">
        <img src="pieces/wP.svg" alt="" /> Play vs Friend
      </div>

      <div class="invite" id="invite">
        <div class="invite-title">Invite a friend to play</div>
        <div class="invite-row">
          <input id="invite-link" readonly />
          <button id="copy-btn" class="btn btn-primary">Copy</button>
        </div>
      </div>

      <div id="status"></div>

      <div id="draw-offer" hidden>
        <span id="draw-offer-text"></span>
        <div>
          <button class="btn btn-primary btn-small" id="accept-draw">Accept</button>
          <button class="btn btn-secondary btn-small" id="decline-draw">Decline</button>
        </div>
      </div>

      <div class="moves" id="moves"></div>

      <div class="actions">
        <button class="btn btn-secondary" id="draw-btn" title="Offer draw">½ Draw</button>
        <button class="btn btn-secondary" id="resign-btn" title="Resign">⚑ Resign</button>
        <button class="btn btn-secondary" id="flip-btn" title="Flip board">⇅ Flip</button>
        <button class="btn btn-secondary" id="new-game-btn" title="New game">＋ New</button>
      </div>

      <div class="chat">
        <div id="messages"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="300" placeholder="Send a message…" autocomplete="off" />
        </form>
      </div>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
